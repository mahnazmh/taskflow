<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="TaskFlow helps you organize and manage your daily tasks.">
        <title>TaskFlow | Task Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="app">

            <!-- Sidebar -->
            <aside class="sidebar">
                <h2 class="logo">TaskFlow</h2>

                <nav class="nav-menu">
                    <button class="nav-link active" data-filter="all">
                        All Tasks
                    </button>

                    <button class="nav-link" data-filter="today">
                        Today
                    </button>

                    <button class="nav-link" data-filter="completed">
                        Completed
                    </button>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">

                <!-- Header -->
                <header class="header">
                    <div>
                        <h1>My Tasks</h1>
                        <p>Manage your daily activities</p>
                    </div>

                    <button class="add-btn">+ Add Task</button>
                </header>

                <!-- Statistics -->
                <section class="stats">

                    <div class="stat-card">
                        <h3>Total Tasks</h3>
                        <p id="total-count">0</p>
                    </div>

                    <div class="stat-card">
                        <h3>Completed</h3>
                        <p id="completed-count">0</p>
                    </div>

                    <div class="stat-card">
                        <h3>Pending</h3>
                        <p id="pending-count">0</p>
                    </div>

                </section>

                <!-- Task List -->
                <section class="task-section">

                    <h2>My Task List</h2>

                    <div class="task-list">

                        <!-- Sample Task 1 -->
                        <div class="task-item" data-priority="high" data-completed="false">

                            <div class="task-info">
                                <span class="task-name">Pilates Training</span>
                                <small class="task-date"></small>
                            </div>

                            <div class="task-actions">
                                <span class="priority high">High</span>
                                <button class="complete-btn">Complete</button>
                                <button class="edit-btn">Edit</button>
                                <button class="delete-btn">Delete</button>
                            </div>

                        </div>

                        <!-- Sample Task 2 -->
                        <div class="task-item" data-priority="medium" data-completed="false">

                            <div class="task-info">
                                <span class="task-name">Do Research</span>
                                <small class="task-date"></small>
                            </div>

                            <div class="task-actions">
                                <span class="priority medium">Medium</span>
                                <button class="complete-btn">Complete</button>
                                <button class="edit-btn">Edit</button>
                                <button class="delete-btn">Delete</button>
                            </div>

                        </div>

                        <!-- Sample Task 3 -->
                        <div class="task-item" data-priority="low" data-completed="false">

                            <div class="task-info">
                                <span class="task-name">ُRead Novel</span>
                                <small class="task-date"></small>
                            </div>

                            <div class="task-actions">
                                <span class="priority low">Low</span>
                                <button class="complete-btn">Complete</button>
                                <button class="edit-btn">Edit</button>
                                <button class="delete-btn">Delete</button>
                            </div>

                        </div>

                    </div>

                    <p class="empty-message" hidden>
                        No tasks found. Add a new task to get started!
                    </p>

                </section>

            </main>

        </div>

        <script src="script.js"></script>

    </body>

</html>
